<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -6 128 124" width="128" height="124">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d9298"/>
      <stop offset="0.22" stop-color="#f4f6f8"/>
      <stop offset="0.45" stop-color="#b7bcc2"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#9aa0a6"/>
      <stop offset="1" stop-color="#6f757b"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d4d8dc"/>
      <stop offset="1" stop-color="#9ea4aa"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="0.4" stop-color="#aeb4ba"/>
      <stop offset="0.7" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#7c8288"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d838a"/>
      <stop offset="0.5" stop-color="#f1f3f5"/>
      <stop offset="1" stop-color="#8b9197"/>
    </linearGradient>
  </defs>
  <g transform="rotate(32 50 56)">
    <!-- needle -->
    <polygon points="47.6,60 52.4,60 50,112" fill="url(#needle)"/>
    <!-- base flange: underside lip, then top face -->
    <path d="M22 50 Q22 66 50 66 Q78 66 78 50 Z" fill="url(#dome)"/>
    <ellipse cx="50" cy="50" rx="28" ry="9" fill="url(#head)"/>
    <ellipse cx="50" cy="49" rx="21" ry="5.5" fill="#ffffff" opacity="0.5"/>
    <!-- stem -->
    <path d="M40 12 L60 12 L64 49 Q50 56 36 49 Z" fill="url(#metal)"/>
    <!-- head -->
    <ellipse cx="50" cy="11" rx="19" ry="7" fill="url(#head)"/>
    <ellipse cx="46" cy="9.5" rx="9" ry="2.6" fill="#ffffff" opacity="0.7"/>
    <ellipse cx="50" cy="11" rx="19" ry="7" fill="none" stroke="#8d9298" stroke-width="0.8" opacity="0.7"/>
  </g>
</svg>
